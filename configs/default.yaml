# Default Configuration for Burgers PINN Analysis

seed: 42

# Physical domain and governing PDE parameters: u_t + u*u_x - nu*u_xx = 0
physics:
  nu: 0.003183098861837907  # 0.01 / pi
  x_min: -1.0
  x_max: 1.0
  t_min: 0.0
  t_max: 1.0

# Collocation and sampling points (Latin Hypercube Sampling)
collocation:
  n_f: 2500        # Interior collocation points
  n_bc: 100       # Boundary points (split evenly: 50 at x=-1, 50 at x=1)
  n_ic: 100       # Initial condition points at t=0
  n_ext: 1000     # Extrapolation points outside training cylinder
  t_ext_min: 1.0  # Extrapolation interval lower bound
  t_ext_max: 1.3  # Extrapolation interval upper bound

# Neural network architecture: Fully-connected MLP with Tanh activations
model:
  input_dim: 2
  output_dim: 1
  hidden_dim: 50
  hidden_layers: 4
  activation: "tanh"

# Loss component weights: total_loss = w_ic * loss_ic + w_bc * loss_bc + w_pde * loss_pde
loss_weights:
  w_ic: 50.0
  w_bc: 10.0
  w_pde: 1.0

# Staged optimization parameters
training:
  adam_lr: 0.001
  adam_epochs: 2000
  adam_log_freq: 200
  lbfgs_max_iter: 1000
  lbfgs_tolerance_grad: 1.0e-7
  lbfgs_tolerance_change: 1.0e-9
  lbfgs_history_size: 50
  device: "cpu"

# Benchmark validation settings
evaluation:
  n_eval_x: 256
  n_eval_t: 100
  benchmark_url: "https://github.com/maziarraissi/PINNs/raw/master/appendix/Data/burgers_shock.mat"
  benchmark_path: "data/burgers_shock.mat"

# Output directories and filenames
paths:
  checkpoint_dir: "checkpoints"
  checkpoint_file: "burgers_pinn.pt"
  figures_dir: "figures"
  results_dir: "results"
